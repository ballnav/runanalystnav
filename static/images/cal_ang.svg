<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="450" y="50" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">การคำนวณมุมในการวิเคราะห์ท่าทาง</text>

  <!-- Example 1: calculate_angle -->
  <g transform="translate(150, 90)">
    <!-- Points -->
    <circle cx="50" cy="200" r="8" fill="#3366cc" />
    <circle cx="150" cy="100" r="8" fill="#3366cc" />
    <circle cx="250" cy="150" r="8" fill="#3366cc" />

    <!-- Lines -->
    <line x1="50" y1="200" x2="150" y2="100" stroke="#3366cc" stroke-width="3" />
    <line x1="150" y1="100" x2="250" y2="150" stroke="#3366cc" stroke-width="3" />

    <!-- Angle arc -->
    <path d="M 150,100 L 175,80 A 35,35 0 0,1 180,120 Z" fill="#FF9933" fill-opacity="0.5" />

    <!-- Labels -->
    <text x="40" y="220" font-family="Arial" font-size="16">A</text>
    <text x="150" y="90" font-family="Arial" font-size="16">B</text>
    <text x="260" y="160" font-family="Arial" font-size="16">C</text>
    <text x="180" y="110" font-family="Arial" font-size="16">θ</text>

    <!-- Formula -->
    <text x="150" y="270" font-family="Arial" font-size="14" text-anchor="middle">calculate_angle(A, B, C)</text>
    <text x="150" y="290" font-family="Arial" font-size="14" text-anchor="middle">คำนวณมุมที่จุด B</text>
  </g>

  <!-- Example 2: calculate_trunk_lean -->
  <g transform="translate(500, 90)">
    <!-- Human figure outline -->
    <line x1="150" y1="50" x2="150" y2="250" stroke="#999" stroke-width="2" stroke-dasharray="5,5" />
    <line x1="150" y1="50" x2="130" y2="200" stroke="#333" stroke-width="4" />

    <!-- Points -->
    <circle cx="150" cy="50" r="8" fill="#cc3366" />
    <circle cx="130" cy="200" r="8" fill="#cc3366" />

    <!-- Angle arc -->
    <path d="M 150,50 L 150,100 A 50,50 0 0,1 140,99 Z" fill="#99CC33" fill-opacity="0.5" />

    <!-- Labels -->
    <text x="160" y="50" font-family="Arial" font-size="16">A (ไหล่)</text>
    <text x="110" y="210" font-family="Arial" font-size="16">B (สะโพก)</text>
    <text x="165" y="85" font-family="Arial" font-size="16">α</text>
    <text x="170" y="160" font-family="Arial" font-size="12">แนวดิ่ง</text>

    <!-- Formula -->
    <text x="150" y="270" font-family="Arial" font-size="14" text-anchor="middle">calculate_trunk_lean(A, B)</text>
    <text x="150" y="290" font-family="Arial" font-size="14" text-anchor="middle">มุมเอียงของลำตัว</text>
  </g>

  <!-- Evaluation Section -->
  <g transform="translate(450, 400)">
    <rect x="-300" y="0" width="600" height="150" rx="5" ry="20" fill="white" stroke="#ccc" stroke-width="2"/>

    <!-- Evaluation Functions -->
    <text x="0" y="30" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">การประเมินมุม</text>

    <!-- Results -->
    <text x="-200" y="60" font-family="Arial" font-size="14" fill="#008800">✓ Accurate </text>

    <text x="100" y="60" font-family="Arial" font-size="14" fill="#0000ff">✗ Inaccurate </text>

    <!-- Points System -->
    <text x="-200" y="90" font-family="Arial" font-size="14">✓ = 1 คะแนน</text>
    <text x="100" y="90" font-family="Arial" font-size="14">✗ = 0 คะแนน</text>
  </g>

</svg>